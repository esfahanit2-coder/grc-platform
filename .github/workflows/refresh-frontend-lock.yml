name: refresh-frontend-lock-temporary

on:
  push:
    branches: ["security/dependency-advisories-98"]
    paths:
      - "frontend/package.json"
      - ".github/workflows/refresh-frontend-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/dependency-advisories-98
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Regenerate npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Regenerate frontend lockfile for dependency patches (#98)"
          git push origin HEAD:security/dependency-advisories-98
