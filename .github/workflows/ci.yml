name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_DB: grc_test
          POSTGRES_USER: grc
          POSTGRES_PASSWORD: grc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grc -d grc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DJANGO_SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
      POSTGRES_DB: grc_test
      POSTGRES_USER: grc
      POSTGRES_PASSWORD: grc
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: python manage.py test
      - run: python manage.py test apps.common.tests.GoldenPilotScenarioTests apps.connectors.tests.ConnectorEvidenceTests
      - run: python -m compileall .
      - run: cd .. && python scripts/static-check.py --skip-typescript

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Generate real npm lockfile for Issue #2
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove clean reproducible install
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Commit generated lockfile to this PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/frontend-lockfile-release-gate'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json already matches npm output"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add npm-generated frontend lockfile"
          git push origin "HEAD:${HEAD_REF}"
